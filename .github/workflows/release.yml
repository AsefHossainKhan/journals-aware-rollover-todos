name: Release Obsidian plugin

# Cut a release by pushing a tag that matches the manifest version, e.g.:
#   git tag 1.0.2 && git push origin 1.0.2
# The build is verified in CI and its artifacts are published with signed
# provenance attestations so users can confirm main.js was built from this repo.

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write # create the GitHub release
  id-token: write # required by attest-build-provenance
  attestations: write # write the attestation to the attestations store

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title="$TAG" \
            --generate-notes \
            main.js manifest.json
